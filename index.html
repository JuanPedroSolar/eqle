<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Limpieza de espejos · EQLE</title>
<style>
  :root{color-scheme:dark;--ink:#dfe8e4;--muted:#8fa59b;--line:#ffffff24;--accent:#2fbf8f;--accent2:#a6e8cc;--err:#ff9b8f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;min-height:100dvh;padding:24px 16px;color:var(--ink);
    font:500 15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(120% 90% at 50% 38%,#16232d 0%,#0b1016 58%,#06090d 100%)}
  main{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(340px,100%);text-align:center}
  img{display:block;width:min(340px,72vw);height:auto;animation:aparece 1.1s ease both}
  h1{margin:0;font:600 13px Sora,Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#cfe0d8;animation:aparece 1.1s .25s ease both}
  form{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:6px;animation:aparece 1.1s .4s ease both}
  label{font-size:13px;color:var(--muted);text-align:left}
  input[type=password]{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#ffffff0d;color:var(--ink);font:inherit;font-size:16px}
  input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .recordar{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink);cursor:pointer}
  .recordar input{width:20px;height:20px;accent-color:var(--accent)}
  button{min-height:48px;border:0;border-radius:10px;background:var(--accent);color:#04140e;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
  button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  button:disabled{opacity:.6;cursor:progress}
  .barra{width:min(220px,50vw);height:3px;border-radius:2px;background:#ffffff1c;overflow:hidden}
  .barra b{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease}
  #estado{min-height:1.4em;margin:0;font-size:12.5px;color:var(--muted)}
  #estado.error{color:var(--err)}
  @keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <p id="estado" role="status" aria-live="polite">Descargando la presentación…</p>
</main>
<script>
(() => {
  'use strict';
  const VERSION = '20261005115826', CLAVE_LS = 'eqle-llave', $ = id => document.getElementById(id);
  const estado = (t, error) => {$('estado').textContent = t; $('estado').classList.toggle('error', !!error);};
  const barra = p => {$('barra').style.width = (100 * p).toFixed(1) + '%';};
  if (!(window.crypto && crypto.subtle && window.DecompressionStream && window.TextDecoder)) {
    estado('Este navegador es demasiado antiguo. Abre el enlace con Chrome, Edge, Safari 16.4 o Firefox actualizados.', true);
    $('entrar').disabled = true; return;
  }
  // descarga en segundo plano mientras se teclea la contraseña
  const datos = (async () => {
    const r = await fetch('eqle.bin?v=' + VERSION);
    if (!r.ok) throw new Error('No se ha podido descargar la presentación (' + r.status + ').');
    const total = +r.headers.get('content-length') || 0, partes = []; let n = 0;
    const lector = r.body.getReader();
    for (;;) {const {done, value} = await lector.read(); if (done) break; partes.push(value); n += value.length; if (total) barra(.8 * n / total);}
    const b = new Uint8Array(n); let o = 0; for (const p of partes) {b.set(p, o); o += p.length;}
    const magia = new TextDecoder().decode(b.subarray(0, 5));
    if (magia !== 'EQLE1') throw new Error('Archivo de la presentación no reconocido.');
    return {cab: b.subarray(0, 5), iter: new DataView(b.buffer, 5, 4).getUint32(0), sal: b.slice(9, 25), iv: b.slice(25, 37), cuerpo: b.subarray(37)};
  })();
  datos.then(() => {if (!ocupado) estado('Lista. Escribe la contraseña.');}, e => estado(e.message, true));
  let ocupado = false;
  async function llaveDe(clave, d) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', hash: 'SHA-256', salt: d.sal, iterations: d.iter}, base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
  }
  async function descifrar(llave, d) {   // AES-GCM autentica: con otra contrasena falla
    try {return await crypto.subtle.decrypt({name: 'AES-GCM', iv: d.iv, additionalData: d.cab}, llave, d.cuerpo);}
    catch (e) {throw new Error('Contraseña incorrecta.');}
  }
  async function mostrar(plano) {
    estado('Abriendo…'); barra(.92);
    const html = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    barra(1);
    document.open(); document.write(html); document.close();
  }
  const b64 = u => btoa(String.fromCharCode(...u));
  // «recordar»: la clave derivada (no la contraseña), atada a la sal de este archivo
  (async () => {
    let guardada = null; try {guardada = JSON.parse(localStorage.getItem(CLAVE_LS) || 'null');} catch (e) {/* sin almacenamiento */}
    if (!guardada) return;
    try {
      const d = await datos;
      if (guardada.sal !== b64(d.sal)) {try {localStorage.removeItem(CLAVE_LS);} catch (e) {/* nada */} return;}
      ocupado = true; $('entrar').disabled = true; $('recordar').checked = true; estado('Abriendo…');
      const llave = await crypto.subtle.importKey('raw', Uint8Array.from(atob(guardada.k), c => c.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
      await mostrar(await descifrar(llave, d));
    } catch (e) {ocupado = false; $('entrar').disabled = false; try {localStorage.removeItem(CLAVE_LS);} catch (x) {/* nada */} estado('Escribe la contraseña.');}
  })();
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault(); if (ocupado) return;
    const clave = $('clave').value; if (!clave) return;
    ocupado = true; $('entrar').disabled = true;
    try {
      const d = await datos; estado('Comprobando la contraseña…'); barra(.82);
      const llave = await llaveDe(clave, d), plano = await descifrar(llave, d);
      if ($('recordar').checked) {
        try {localStorage.setItem(CLAVE_LS, JSON.stringify({sal: b64(d.sal), k: b64(new Uint8Array(await crypto.subtle.exportKey('raw', llave)))}));} catch (e) {/* sin almacenamiento */}
      }
      await mostrar(plano);
    } catch (e) {ocupado = false; $('entrar').disabled = false; estado(e.message || 'No se ha podido abrir.', true); $('clave').select();}
  });
})();
</script>
</body>
</html>
